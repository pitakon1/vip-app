    <style id="theme-vars">
/* =========================================================
   房地产租赁管理后台 — 品牌设计令牌 (Modern Light)
   单一靛蓝主色 · 冷调浅灰底 · 白色卡片 · 细边框 · 克制圆角
   ========================================================= */

:root {
  /* ---- 语义色（apply-html-head-contract 必需别名） ---- */
  --rent-background: #f2f4f8;
  --rent-foreground: #0f172a;
  --rent-card: #ffffff;
  --rent-card-foreground: #0f172a;
  --rent-popover: #ffffff;
  --rent-popover-foreground: #0f172a;
  --rent-primary: #14b8a6;
  --rent-primary-foreground: #ffffff;
  --rent-muted: #f1f5f9;
  --rent-muted-foreground: #64748b;
  --rent-border: #e6eaf0;
  --rent-input: #e6eaf0;
  --rent-ring: #14b8a6;

  /* ---- 中性阶梯（直接引用） ---- */
  --rent-ink: #0f172a;
  --rent-ink-2: #475569;
  --rent-ink-3: #94a3b8;
  --rent-line: #e6eaf0;
  --rent-surface: #ffffff;
  --rent-surface-2: #f1f5f9;
  --rent-sidebar: #ffffff;
  --rent-sidebar-active: #d9f2ee;

  /* ---- 状态色（仅语义状态） ---- */
  --state-success: #16a34a;
  --state-warning: #d97706;
  --state-error: #dc2626;
  --state-info: #0ea5e9;

  /* ---- 圆角（克制阶梯，上限 16px） ---- */
  --rent-radius-sm: 6px;
  --rent-radius-md: 12px;
  --rent-radius-lg: 20px;
  --rent-radius-full: 9999px;

  /* ---- 阴影（静态面 alpha ≤ 0.05；深阴影仅浮层） ---- */
  --rent-shadow-1: 0 1px 2px rgba(15, 23, 42, 0.05), 0 2px 8px rgba(15, 23, 42, 0.04);
  --rent-shadow-2: 0 12px 32px -12px rgba(15, 23, 42, 0.16);
  --rent-shadow-3: 0 24px 60px -20px rgba(15, 23, 42, 0.30);

  /* ---- 间距（8pt 网格） ---- */
  --rent-s-1: 4px;
  --rent-s-2: 8px;
  --rent-s-3: 12px;
  --rent-s-4: 16px;
  --rent-s-5: 24px;
  --rent-s-6: 32px;
  --rent-s-7: 48px;
  --rent-s-8: 80px;

  /* ---- 字体系统 ---- */
  --rent-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --rent-font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", monospace;

  color-scheme: light;
}

/* ---- 暗色模式（双模变量，设计态默认 light） ---- */
.dark {
  --rent-background: #0b0f1a;
  --rent-foreground: #e8edf5;
  --rent-card: #141a26;
  --rent-card-foreground: #e8edf5;
  --rent-popover: #141a26;
  --rent-popover-foreground: #e8edf5;
  --rent-primary: #2dd4bf;
  --rent-primary-foreground: #0b0f1a;
  --rent-muted: #1c2433;
  --rent-muted-foreground: #94a3b8;
  --rent-border: #243044;
  --rent-input: #243044;
  --rent-ring: #2dd4bf;

  --rent-ink: #e8edf5;
  --rent-ink-2: #a3aec2;
  --rent-ink-3: #64748b;
  --rent-line: #243044;
  --rent-surface: #141a26;
  --rent-surface-2: #1c2433;
  --rent-sidebar: #0f1521;
  --rent-sidebar-active: #1e2a44;

  --rent-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.30);
  --rent-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.50);
  --rent-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.65);

  color-scheme: dark;
}

/* ---- 排版类 ---- */
.rent-h1 {
  font-family: var(--rent-font-sans);
  font-size: clamp(24px, 2.6vw, 32px);
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--rent-ink);
}

.rent-h2 {
  font-family: var(--rent-font-sans);
  font-size: clamp(20px, 2vw, 24px);
  line-height: 1.25;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--rent-ink);
}

.rent-h3 {
  font-family: var(--rent-font-sans);
  font-size: 18px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--rent-ink);
}

.rent-body-lg {
  font-family: var(--rent-font-sans);
  font-size: 16px;
  line-height: 1.6;
  font-weight: 400;
  color: var(--rent-ink-2);
}

.rent-body {
  font-family: var(--rent-font-sans);
  font-size: 14px;
  line-height: 1.6;
  font-weight: 400;
  color: var(--rent-ink-2);
}

.rent-caption {
  font-family: var(--rent-font-sans);
  font-size: 12px;
  line-height: 1.5;
  font-weight: 400;
  letter-spacing: 0.005em;
  color: var(--rent-ink-3);
}

.rent-mono {
  font-family: var(--rent-font-mono);
  font-size: 13px;
  line-height: 1.5;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.rent-num {
  font-family: var(--rent-font-sans);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  letter-spacing: -0.02em;
}

    <style id="rent-components">
/* ===== App Shell Layout ===== */
.rent-app {
  display: grid;
  grid-template-columns: 240px 1fr;
  grid-template-rows: 56px 1fr;
  grid-template-areas: "sidebar topbar" "sidebar main";
  height: 100vh;
  background: var(--rent-background);
}
.rent-app__sidebar { grid-area: sidebar; }
.rent-app__topbar { grid-area: topbar; }
.rent-app__main { grid-area: main; overflow-y: auto; }

/* ===== Sidebar ===== */
.rent-sidebar {
  background: var(--rent-sidebar);
  border-right: 1px solid var(--rent-border);
  display: flex;
  flex-direction: column;
  height: 100vh;
  position: sticky;
  top: 0;
}
.rent-sidebar__brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 20px;
  height: 56px;
  border-bottom: 1px solid var(--rent-border);
  flex-shrink: 0;
}
.rent-sidebar__logo {
  width: 32px; height: 32px;
  border-radius: var(--rent-radius-md);
  background: var(--rent-primary);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 16px;
  flex-shrink: 0;
}
.rent-sidebar__name {
  font-family: var(--rent-font-sans);
  font-size: 15px; font-weight: 600;
  color: var(--rent-ink);
  letter-spacing: -0.01em;
}
.rent-sidebar__nav {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  list-style: none;
  margin: 0;
}
.rent-sidebar__section-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--rent-ink-3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 16px 12px 6px;
}
.rent-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--rent-radius-md);
  font-size: 14px;
  font-weight: 500;
  color: var(--rent-ink-2);
  text-decoration: none;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  margin-bottom: 2px;
}
.rent-nav-item:hover { background: var(--rent-surface-2); color: var(--rent-ink); }
.rent-nav-item[data-active="true"] {
  background: var(--rent-sidebar-active);
  color: var(--rent-primary);
  font-weight: 600;
}
.rent-nav-item__icon {
  width: 18px; height: 18px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.rent-sidebar__footer {
  padding: 12px;
  border-top: 1px solid var(--rent-border);
  flex-shrink: 0;
}

/* ===== Topbar ===== */
.rent-topbar {
  background: var(--rent-surface);
  border-bottom: 1px solid var(--rent-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: 56px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.rent-topbar__left { display: flex; align-items: center; gap: 16px; }
.rent-topbar__title {
  font-size: 18px; font-weight: 600;
  color: var(--rent-ink);
  letter-spacing: -0.01em;
}
.rent-topbar__right { display: flex; align-items: center; gap: 12px; }
.rent-search {
  display: flex; align-items: center; gap: 8px;
  background: var(--rent-surface-2);
  border: 1px solid var(--rent-border);
  border-radius: var(--rent-radius-md);
  padding: 7px 12px;
  width: 280px;
}
.rent-search input {
  border: none; background: none; outline: none;
  font-size: 13px; color: var(--rent-ink);
  flex: 1;
  font-family: var(--rent-font-sans);
}
.rent-search input::placeholder { color: var(--rent-ink-3); }
.rent-icon-btn {
  width: 36px; height: 36px;
  border: 1px solid var(--rent-border);
  border-radius: var(--rent-radius-md);
  background: var(--rent-surface);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  position: relative;
  transition: background 0.15s;
}
.rent-icon-btn:hover { background: var(--rent-surface-2); }
.rent-icon-btn__badge {
  position: absolute;
  top: -2px; right: -2px;
  width: 16px; height: 16px;
  border-radius: var(--rent-radius-full);
  background: var(--state-error);
  color: #fff;
  font-size: 10px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
}
.rent-avatar {
  width: 32px; height: 32px;
  border-radius: var(--rent-radius-full);
  background: var(--rent-primary);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
  flex-shrink: 0;
}
.rent-avatar--sm { width: 28px; height: 28px; font-size: 12px; }
.rent-avatar--lg { width: 48px; height: 48px; font-size: 18px; }

/* ===== Main Content ===== */
.rent-main {
  padding: 24px;
  max-width: 100%;
}
.rent-page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 24px;
  gap: 16px;
}
.rent-page-header__title {
  font-size: 24px; font-weight: 600;
  color: var(--rent-ink);
  letter-spacing: -0.02em;
  margin: 0 0 4px;
}
.rent-page-header__subtitle {
  font-size: 14px;
  color: var(--rent-ink-3);
}
.rent-page-header__actions {
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}

/* ===== Card ===== */
.rent-card {
  background: var(--rent-card);
  border: 1px solid var(--rent-border);
  border-radius: var(--rent-radius-lg);
  overflow: hidden;
}
.rent-card__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--rent-border);
}
.rent-card__title {
  font-size: 16px; font-weight: 600;
  color: var(--rent-ink);
  margin: 0;
}
.rent-card__body { padding: 20px; }
.rent-card__footer {
  padding: 12px 20px;
  border-top: 1px solid var(--rent-border);
  background: var(--rent-surface-2);
}

/* ===== Button ===== */
.rent-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--rent-radius-md);
  font-size: 14px;
  font-weight: 500;
  font-family: var(--rent-font-sans);
  border: 1px solid transparent;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
  text-decoration: none;
  white-space: nowrap;
  line-height: 1.4;
}
.rent-btn--primary {
  background: var(--rent-primary);
  color: var(--rent-primary-foreground);
}
.rent-btn--primary:hover { background: #0d9488; }
.rent-btn--secondary {
  background: var(--rent-surface);
  border-color: var(--rent-border);
  color: var(--rent-ink);
}
.rent-btn--secondary:hover { background: var(--rent-surface-2); }
.rent-btn--ghost {
  background: transparent;
  color: var(--rent-ink-2);
}
.rent-btn--ghost:hover { background: var(--rent-surface-2); }
.rent-btn--danger {
  background: var(--state-error);
  color: #fff;
}
.rent-btn--danger:hover { background: #b91c1c; }
.rent-btn--success {
  background: var(--state-success);
  color: #fff;
}
.rent-btn--sm { padding: 5px 12px; font-size: 13px; }
.rent-btn--lg { padding: 12px 24px; font-size: 15px; }
.rent-btn--block { width: 100%; }
.rent-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ===== Table ===== */
.rent-table-wrap {
  overflow-x: auto;
  border-radius: var(--rent-radius-lg);
  border: 1px solid var(--rent-border);
}
.rent-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.rent-table thead th {
  background: var(--rent-surface-2);
  padding: 12px 16px;
  text-align: left;
  font-weight: 600;
  font-size: 13px;
  color: var(--rent-ink-2);
  border-bottom: 1px solid var(--rent-border);
  white-space: nowrap;
}
.rent-table tbody td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--rent-border);
  color: var(--rent-ink);
  vertical-align: middle;
}
.rent-table tbody tr:last-child td { border-bottom: none; }
.rent-table tbody tr:hover { background: var(--rent-surface-2); }
.rent-table__mono { font-family: var(--rent-font-mono); font-size: 13px; }

/* ===== Badge ===== */
.rent-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: var(--rent-radius-full);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.4;
}
.rent-badge--success { background: rgba(22,163,74,0.1); color: var(--state-success); }
.rent-badge--warning { background: rgba(217,119,6,0.1); color: var(--state-warning); }
.rent-badge--error { background: rgba(220,38,38,0.1); color: var(--state-error); }
.rent-badge--info { background: rgba(14,165,233,0.1); color: var(--state-info); }
.rent-badge--neutral { background: var(--rent-surface-2); color: var(--rent-ink-2); }
.rent-badge--primary { background: rgba(20,184,166,0.1); color: var(--rent-primary); }
.rent-badge--dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }

/* ===== KPI / Stat Card ===== */
.rent-stat-card {
  background: var(--rent-card);
  border: 1px solid var(--rent-border);
  border-radius: var(--rent-radius-lg);
  padding: 20px;
}
.rent-stat-card__label {
  font-size: 13px;
  color: var(--rent-ink-3);
  margin-bottom: 8px;
}
.rent-stat-card__value {
  font-size: 28px;
  font-weight: 700;
  color: var(--rent-ink);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.rent-stat-card__delta {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 500;
  margin-top: 8px;
}
.rent-stat-card__delta--up { color: var(--state-success); }
.rent-stat-card__delta--down { color: var(--state-error); }
.rent-stat-card__icon {
  width: 40px; height: 40px;
  border-radius: var(--rent-radius-md);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

/* ===== Grid Utilities ===== */
.rent-grid { display: grid; gap: 16px; }
.rent-grid--2 { grid-template-columns: repeat(2, 1fr); }
.rent-grid--3 { grid-template-columns: repeat(3, 1fr); }
.rent-grid--4 { grid-template-columns: repeat(4, 1fr); }
.rent-grid--auto { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }

/* ===== Misc ===== */

}
.rv17-consign-hero::after {
  content: ""; position: absolute; right: -44px; top: -44px;

  pointer-events: none;
}
.rv17-consign-hero__icon {
  width: 52px; height: 52px; flex-shrink: 0;
  border-radius: 16px; background: rgba(255, 255, 255, 0.16);
  border: 1px solid rgba(255, 255, 255, 0.24);
  display: flex; align-items: center; justify-content: center;
}
.rv17-consign-hero__icon svg { width: 26px; height: 26px; color: #fff; }
.rv17-consign-hero__body { flex: 1; min-width: 0; position: relative; z-index: 1; }
.rv17-consign-hero__title { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.rv17-consign-hero__desc { font-size: 13px; color: rgba(255, 255, 255, 0.82); margin-top: 3px; }
.rv17-consign-hero__tags { display: flex; gap: 8px; flex-wrap: wrap; position: relative; z-index: 1; }
.rv17-consign-hero__tag {
  background: rgba(255, 255, 255, 0.16); color: #fff;
  border: 1px solid rgba(255, 255, 255, 0.26);
  border-radius: 999px; padding: 5px 12px;
  font-size: 12px; font-weight: 500; white-space: nowrap;
}

.rv17-field { margin-bottom: 18px; }
.rv17-field:last-child { margin-bottom: 0; }
.rv17-field__label { display: block; font-size: 13px; font-weight: 600; color: var(--rent-ink); margin-bottom: 8px; }
.rv17-chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
.rv17-chip {
  padding: 8px 16px; border-radius: 999px; cursor: pointer;
  background: var(--rent-card); border: 1px solid var(--rent-border);
  font-size: 13px; font-weight: 500; color: var(--rent-ink-2);
  font-family: var(--rent-font-sans);
  transition: border-color .15s, color .15s, background .15s;
}
.rv17-chip:hover { border-color: rgba(20,184,166, 0.45); color: var(--rent-primary); }
.rv17-chip[data-active="true"] {
  background: rgba(20,184,166, 0.10); border-color: var(--rent-primary);
  color: var(--rent-primary); font-weight: 600;
}
.rv17-input {
  display: flex; align-items: center; gap: 8px;
  border: 1px solid var(--rent-border); border-radius: 12px;
  background: var(--rent-card); padding: 10px 14px;
  transition: border-color .15s, box-shadow .15s;
}
.rv17-input svg { width: 16px; height: 16px; color: var(--rent-ink-3); flex-shrink: 0; }
.rv17-input input { border: none; outline: none; background: none; flex: 1; font-size: 14px; color: var(--rent-ink); font-family: var(--rent-font-sans); }
.rv17-input:focus-within { border-color: var(--rent-primary); box-shadow: 0 0 0 3px rgba(20,184,166, 0.12); }
.rv17-textarea {
  width: 100%; min-height: 84px; resize: vertical; box-sizing: border-box;
  border: 1px solid var(--rent-border); border-radius: 12px;
  background: var(--rent-card); padding: 10px 14px;
  font-size: 14px; color: var(--rent-ink); font-family: var(--rent-font-sans);
  transition: border-color .15s, box-shadow .15s;
}
.rv17-textarea:focus { border-color: var(--rent-primary); box-shadow: 0 0 0 3px rgba(20,184,166, 0.12); outline: none; }
.rv17-submit { height: 48px; font-size: 16px; font-weight: 600; border-radius: 14px; box-shadow: 0 8px 20px -8px rgba(20,184,166, 0.55); }
.rv17-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
@media (max-width: 640px) { .rv17-form-grid { grid-template-columns: 1fr; } }

.rv17-consign-record__top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.rv17-consign-record__user { display: flex; align-items: center; gap: 12px; min-width: 0; }
.rv17-consign-record__name { font-size: 15px; font-weight: 600; color: var(--rent-ink); }
.rv17-consign-record__meta { font-size: 12px; color: var(--rent-ink-3); margin-top: 3px; }

.rv17-consign-record__foot {

  font-size: 12px; color: var(--rent-ink-3); margin-top: 10px;
}

/* ---------- 购房订单 ---------- */
.rv17-order-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.rv17-order-count { font-size: 12px; font-weight: 500; color: var(--rent-ink-3); margin-left: 6px; vertical-align: 2px; }
.rv17-order + .rv17-order { border-top: 1px dashed var(--rent-border); margin-top: 16px; padding-top: 16px; }
.rv17-order__top { display: flex; align-items: center; gap: 14px; }
.rv17-order__thumb {

.rv17-order__thumb svg { width: 34px; height: 34px; }
.rv17-order__info { flex: 1; min-width: 0; }
.rv17-order__name { font-size: 15px; font-weight: 600; color: var(--rent-ink); }
.rv17-order__meta { font-size: 13px; color: var(--rent-ink-2); margin-top: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.rv17-order__meta b { color: var(--rent-primary); font-weight: 700; font-variant-numeric: tabular-nums; }
.rv17-order__date { font-size: 12px; color: var(--rent-ink-3); margin-top: 4px; }

/* 步骤条 */
.rv17-stepper { display: flex; margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--rent-border); }
.rv17-step { flex: 1; text-align: center; position: relative; }
.rv17-step + .rv17-step::before {
  content: ""; position: absolute; top: 14px; left: -50%; width: 100%;
  height: 3px; background: var(--rent-border); border-radius: 2px;
}
.rv17-step--done + .rv17-step::before { background: var(--rent-primary); }
.rv17-step--current + .rv17-step::before { background: rgba(20,184,166, 0.35); }
.rv17-step__dot {
  position: relative; z-index: 1;
  width: 28px; height: 28px; margin: 0 auto 8px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums;
  background: var(--rent-surface-2); border: 2px solid var(--rent-border);
  color: var(--rent-ink-3);
  font-family: var(--rent-font-sans);
}
.rv17-step--done .rv17-step__dot { background: var(--rent-primary); border-color: var(--rent-primary); color: #fff; }
.rv17-step--current .rv17-step__dot {
  background: var(--rent-card); border-color: var(--rent-primary); color: var(--rent-primary);
  box-shadow: 0 0 0 4px rgba(20,184,166, 0.12);
  font-size: 13px;
}
.rv17-step__label { font-size: 12px; color: var(--rent-ink-3); }
.rv17-step--done .rv17-step__label,
.rv17-step--current .rv17-step__label { color: var(--rent-ink); font-weight: 600; }

.rv17-order-empty {
  margin-top: 16px; padding: 32px 20px; text-align: center;
  background: var(--rent-card); border: 1px dashed var(--rent-border); border-radius: 20px;
}
.rv17-order-empty svg { width: 40px; height: 40px; color: var(--rent-ink-3); margin-bottom: 10px; }
.rv17-order-empty__title { font-size: 14px; font-weight: 600; color: var(--rent-ink); }
.rv17-order-empty__sub { font-size: 12px; color: var(--rent-ink-3); margin-top: 4px; }

/* 移动端微调 */
.rent-mobile__card .rv17-order + .rv17-order { border-top: 1px solid var(--rent-border); margin-top: 0; padding-top: 14px; }
.rent-mobile__card .rv17-stepper { margin-top: 14px; }
@media (max-width: 430px) {

  .rv17-step + .rv17-step::before { top: 12px; }
  .rv17-step__label { font-size: 11px; }
}
