/* =========================================================
   HaoFang.World — 品牌设计令牌 (Refined Premium)
   品牌青绿 · 温暖米白底 · 白色卡片 · 暖描边 · 温和圆角
   ========================================================= */

:root {
  /* ---- 语义色（apply-html-head-contract 必需别名） ---- */
  --rent-background: #fbf9f6;
  --rent-foreground: #1c2733;
  --rent-card: #ffffff;
  --rent-card-foreground: #1c2733;
  --rent-popover: #ffffff;
  --rent-popover-foreground: #1c2733;
  --rent-primary: #14b8a6;
  --rent-primary-foreground: #ffffff;
  --rent-muted: #f3f1ec;
  --rent-muted-foreground: #6b7280;
  --rent-border: #ece7df;
  --rent-input: #ece7df;
  --rent-ring: #14b8a6;

  /* ---- 中性阶梯（直接引用） ---- */
  --rent-ink: #1c2733;
  --rent-ink-2: #55606c;
  --rent-ink-3: #98a1ab;
  --rent-line: #ece7df;
  --rent-surface: #ffffff;
  --rent-surface-2: #f4f1ec;
  --rent-sidebar: #ffffff;
  --rent-sidebar-active: #d9f2ee;

  /* ---- 状态色（仅语义状态） ---- */
  --state-success: #16a34a;
  --state-warning: #d97706;
  --state-error: #dc2626;
  --state-info: #0ea5e9;

  /* ---- 圆角（温和阶梯，上限 18px） ---- */
  --rent-radius-sm: 6px;
  --rent-radius-md: 10px;
  --rent-radius-lg: 18px;
  --rent-radius-full: 9999px;

  /* ---- 阴影（静态面 alpha ≤ 0.05；深阴影仅浮层） ---- */
  --rent-shadow-1: 0 1px 2px rgba(28, 39, 51, 0.04), 0 1px 3px rgba(28, 39, 51, 0.03);
  --rent-shadow-2: 0 10px 30px -10px rgba(28, 39, 51, 0.14);
  --rent-shadow-3: 0 28px 70px -24px rgba(28, 39, 51, 0.26);

  /* ---- 间距（8pt 网格） ---- */
  --rent-s-1: 4px;
  --rent-s-2: 8px;
  --rent-s-3: 12px;
  --rent-s-4: 16px;
  --rent-s-5: 24px;
  --rent-s-6: 32px;
  --rent-s-7: 48px;
  --rent-s-8: 80px;

  /* ---- 字体系统 ---- */
  --rent-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --rent-font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", monospace;
  --rent-primary-hover: #0d9488;
  --rent-primary-rgb: 20, 184, 166;
  --state-warning-soft: #fdf5e9;
  --state-warning-light: #f4d9ad;
  --state-error-hover: #b91c1c;
  --state-purple: #7a5cd6;

  color-scheme: light;
}

/* ---- 暗色模式（双模变量，设计态默认 light） ---- */
.dark {
  --rent-background: #12161d;
  --rent-foreground: #e9eef4;
  --rent-card: #1a2029;
  --rent-card-foreground: #e9eef4;
  --rent-popover: #1a2029;
  --rent-popover-foreground: #e9eef4;
  --rent-primary: #34c6b4;
  --rent-primary-foreground: #0d1418;
  --rent-muted: #232a35;
  --rent-muted-foreground: #98a1ab;
  --rent-border: #2a3240;
  --rent-input: #2a3240;
  --rent-ring: #34c6b4;

  --rent-ink: #e9eef4;
  --rent-ink-2: #a9b3c0;
  --rent-ink-3: #6f7885;
  --rent-line: #2a3240;
  --rent-surface: #1a2029;
  --rent-surface-2: #232a35;
  --rent-sidebar: #151a22;
  --rent-sidebar-active: #1e2c33;

  --rent-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.32);
  --rent-shadow-2: 0 10px 30px -10px rgba(0, 0, 0, 0.52);
  --rent-shadow-3: 0 28px 70px -24px rgba(0, 0, 0, 0.66);
  --rent-primary-hover: #5ad9c8;
  --rent-primary-rgb: 52, 198, 180;
  --state-warning-soft: #2a2216;
  --state-warning-light: #5c4a2a;

  color-scheme: dark;
}

/* ---- 排版类 ---- */
.rent-h1 {
  font-family: var(--rent-font-sans);
  font-size: clamp(24px, 2.6vw, 32px);
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--rent-ink);
}

.rent-h2 {
  font-family: var(--rent-font-sans);
  font-size: clamp(20px, 2vw, 24px);
  line-height: 1.25;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--rent-ink);
}

.rent-h3 {
  font-family: var(--rent-font-sans);
  font-size: 20px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--rent-ink);
}

.rent-body-lg {
  font-family: var(--rent-font-sans);
  font-size: 17px;
  line-height: 1.6;
  font-weight: 400;
  color: var(--rent-ink-2);
}

.rent-body {
  font-family: var(--rent-font-sans);
  font-size: 15px;
  line-height: 1.6;
  font-weight: 400;
  color: var(--rent-ink-2);
}

.rent-caption {
  font-family: var(--rent-font-sans);
  font-size: 13px;
  line-height: 1.5;
  font-weight: 400;
  letter-spacing: 0.005em;
  color: var(--rent-ink-3);
}

.rent-mono {
  font-family: var(--rent-font-mono);
  font-size: 13px;
  line-height: 1.5;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.rent-num {
  font-family: var(--rent-font-sans);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  letter-spacing: -0.02em;
}

    <style id="rent-components">
/* ===== App Shell Layout ===== */
.rent-app {
  display: grid;
  grid-template-columns: 240px 1fr;
  grid-template-rows: 56px 1fr;
  grid-template-areas: "sidebar topbar" "sidebar main";
  height: 100vh;
  background: var(--rent-background);
}
.rent-app__sidebar { grid-area: sidebar; }
.rent-app__topbar { grid-area: topbar; }
.rent-app__main { grid-area: main; overflow-y: auto; }

/* ===== Sidebar ===== */
.rent-sidebar {
  background: var(--rent-sidebar);
  border-right: 1px solid var(--rent-border);
  display: flex;
  flex-direction: column;
  height: 100vh;
  position: sticky;
  top: 0;
}
.rent-sidebar__brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 20px;
  height: 56px;
  border-bottom: 1px solid var(--rent-border);
  flex-shrink: 0;
}
.rent-sidebar__logo {
  width: 32px; height: 32px;
  border-radius: var(--rent-radius-md);
  background: var(--rent-primary);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 17px;
  flex-shrink: 0;
}
.rent-sidebar__name {
  font-family: var(--rent-font-sans);
  font-size: 15px; font-weight: 600;
  color: var(--rent-ink);
  letter-spacing: -0.01em;
}
.rent-sidebar__nav {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  list-style: none;
  margin: 0;
}
.rent-sidebar__section-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--rent-ink-3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 16px 12px 6px;
}
.rent-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--rent-radius-md);
  font-size: 15px;
  font-weight: 500;
  color: var(--rent-ink-2);
  text-decoration: none;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  margin-bottom: 2px;
}
.rent-nav-item:hover { background: var(--rent-surface-2); color: var(--rent-ink); }
.rent-nav-item[data-active="true"] {
  background: var(--rent-sidebar-active);
  color: var(--rent-primary);
  font-weight: 600;
}
.rent-nav-item__icon {
  width: 18px; height: 18px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.rent-sidebar__footer {
  padding: 12px;
  border-top: 1px solid var(--rent-border);
  flex-shrink: 0;
}

/* ===== Topbar ===== */
.rent-topbar {
  background: var(--rent-surface);
  border-bottom: 1px solid var(--rent-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: 56px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.rent-topbar__left { display: flex; align-items: center; gap: 16px; }
.rent-topbar__title {
  font-size: 20px; font-weight: 600;
  color: var(--rent-ink);
  letter-spacing: -0.01em;
}
.rent-topbar__right { display: flex; align-items: center; gap: 12px; }
.rent-search {
  display: flex; align-items: center; gap: 8px;
  background: var(--rent-surface-2);
  border: 1px solid var(--rent-border);
  border-radius: var(--rent-radius-md);
  padding: 7px 12px;
  width: 280px;
}
.rent-search input {
  border: none; background: none; outline: none;
  font-size: 13px; color: var(--rent-ink);
  flex: 1;
  font-family: var(--rent-font-sans);
}
.rent-search input::placeholder { color: var(--rent-ink-3); }
.rent-icon-btn {
  width: 36px; height: 36px;
  border: 1px solid var(--rent-border);
  border-radius: var(--rent-radius-md);
  background: var(--rent-surface);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  position: relative;
  transition: background 0.15s;
}
.rent-icon-btn:hover { background: var(--rent-surface-2); }
.rent-icon-btn__badge {
  position: absolute;
  top: -2px; right: -2px;
  width: 16px; height: 16px;
  border-radius: var(--rent-radius-full);
  background: var(--state-error);
  color: #fff;
  font-size: 11px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
}
.rent-avatar {
  width: 32px; height: 32px;
  border-radius: var(--rent-radius-full);
  background: var(--rent-primary);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
  flex-shrink: 0;
}
.rent-avatar--sm { width: 28px; height: 28px; font-size: 13px; }
.rent-avatar--lg { width: 48px; height: 48px; font-size: 20px; }

/* ===== Main Content ===== */
.rent-main {
  padding: 24px;
  max-width: 100%;
}
.rent-page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 24px;
  gap: 16px;
}
.rent-page-header__title {
  font-size: 24px; font-weight: 600;
  color: var(--rent-ink);
  letter-spacing: -0.02em;
  margin: 0 0 4px;
}
.rent-page-header__subtitle {
  font-size: 15px;
  color: var(--rent-ink-3);
}
.rent-page-header__actions {
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}

/* ===== Card ===== */
.rent-card {
  background: var(--rent-card);
  border: 1px solid var(--rent-border);
  border-radius: var(--rent-radius-lg);
  overflow: hidden;
}
.rent-card__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--rent-border);
}
.rent-card__title {
  font-size: 17px; font-weight: 600;
  color: var(--rent-ink);
  margin: 0;
}
.rent-card__body { padding: 20px; }
.rent-card__footer {
  padding: 12px 20px;
  border-top: 1px solid var(--rent-border);
  background: var(--rent-surface-2);
}

/* ===== Button ===== */
.rent-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--rent-radius-md);
  font-size: 15px;
  font-weight: 500;
  font-family: var(--rent-font-sans);
  border: 1px solid transparent;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
  text-decoration: none;
  white-space: nowrap;
  line-height: 1.4;
}
.rent-btn--primary {
  background: var(--rent-primary);
  color: var(--rent-primary-foreground);
}
.rent-btn--primary:hover { background: #0d9488; }
.rent-btn--secondary {
  background: var(--rent-surface);
  border-color: var(--rent-border);
  color: var(--rent-ink);
}
.rent-btn--secondary:hover { background: var(--rent-surface-2); }
.rent-btn--ghost {
  background: transparent;
  color: var(--rent-ink-2);
}
.rent-btn--ghost:hover { background: var(--rent-surface-2); }
.rent-btn--danger {
  background: var(--state-error);
  color: #fff;
}
.rent-btn--danger:hover { background: #b91c1c; }
.rent-btn--success {
  background: var(--state-success);
  color: #fff;
}
.rent-btn--sm { padding: 5px 12px; font-size: 13px; }
.rent-btn--lg { padding: 12px 24px; font-size: 15px; }
.rent-btn--block { width: 100%; }
.rent-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ===== Table ===== */
.rent-table-wrap {
  overflow-x: auto;
  border-radius: var(--rent-radius-lg);
  border: 1px solid var(--rent-border);
}
.rent-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 15px;
}
.rent-table thead th {
  background: var(--rent-surface-2);
  padding: 12px 16px;
  text-align: left;
  font-weight: 600;
  font-size: 13px;
  color: var(--rent-ink-2);
  border-bottom: 1px solid var(--rent-border);
  white-space: nowrap;
}
.rent-table tbody td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--rent-border);
  color: var(--rent-ink);
  vertical-align: middle;
}
.rent-table tbody tr:last-child td { border-bottom: none; }
.rent-table tbody tr:hover { background: var(--rent-surface-2); }
.rent-table__mono { font-family: var(--rent-font-mono); font-size: 13px; }

/* ===== Badge ===== */
.rent-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: var(--rent-radius-full);
  font-size: 13px;
  font-weight: 500;
  line-height: 1.4;
}
.rent-badge--success { background: rgba(22,163,74,0.1); color: var(--state-success); }
.rent-badge--warning { background: rgba(217,119,6,0.1); color: var(--state-warning); }
.rent-badge--error { background: rgba(220,38,38,0.1); color: var(--state-error); }
.rent-badge--info { background: rgba(14,165,233,0.1); color: var(--state-info); }
.rent-badge--neutral { background: var(--rent-surface-2); color: var(--rent-ink-2); }
.rent-badge--primary { background: rgba(20,184,166,0.1); color: var(--rent-primary); }
.rent-badge--dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }

/* ===== KPI / Stat Card ===== */
.rent-stat-card {
  background: var(--rent-card);
  border: 1px solid var(--rent-border);
  border-radius: var(--rent-radius-lg);
  padding: 20px;
}
.rent-stat-card__label {
  font-size: 13px;
  color: var(--rent-ink-3);
  margin-bottom: 8px;
}
.rent-stat-card__value {
  font-size: 28px;
  font-weight: 700;
  color: var(--rent-ink);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.rent-stat-card__delta {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  font-weight: 500;
  margin-top: 8px;
}
.rent-stat-card__delta--up { color: var(--state-success); }
.rent-stat-card__delta--down { color: var(--state-error); }
.rent-stat-card__icon {
  width: 40px; height: 40px;
  border-radius: var(--rent-radius-md);
