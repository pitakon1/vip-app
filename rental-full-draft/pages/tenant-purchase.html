    <style id="theme-vars">
/* =========================================================
   房地产租赁管理后台 — 品牌设计令牌 (Modern Light)
   单一靛蓝主色 · 冷调浅灰底 · 白色卡片 · 细边框 · 克制圆角
   ========================================================= */

:root {
  /* ---- 语义色（apply-html-head-contract 必需别名） ---- */
  --rent-background: #f2f4f8;
  --rent-foreground: #0f172a;
  --rent-card: #ffffff;
  --rent-card-foreground: #0f172a;
  --rent-popover: #ffffff;
  --rent-popover-foreground: #0f172a;
  --rent-primary: #14b8a6;
  --rent-primary-foreground: #ffffff;
  --rent-muted: #f1f5f9;
  --rent-muted-foreground: #64748b;
  --rent-border: #e6eaf0;
  --rent-input: #e6eaf0;
  --rent-ring: #14b8a6;

  /* ---- 中性阶梯（直接引用） ---- */
  --rent-ink: #0f172a;
  --rent-ink-2: #475569;
  --rent-ink-3: #94a3b8;
  --rent-line: #e6eaf0;
  --rent-surface: #ffffff;
  --rent-surface-2: #f1f5f9;
  --rent-sidebar: #ffffff;
  --rent-sidebar-active: #d9f2ee;

  /* ---- 状态色（仅语义状态） ---- */
  --state-success: #16a34a;
  --state-warning: #d97706;
  --state-error: #dc2626;
  --state-info: #0ea5e9;

  /* ---- 圆角（克制阶梯，上限 16px） ---- */
  --rent-radius-sm: 6px;
  --rent-radius-md: 12px;
  --rent-radius-lg: 20px;
  --rent-radius-full: 9999px;

  /* ---- 阴影（静态面 alpha ≤ 0.05；深阴影仅浮层） ---- */
  --rent-shadow-1: 0 1px 2px rgba(15, 23, 42, 0.05), 0 2px 8px rgba(15, 23, 42, 0.04);
  --rent-shadow-2: 0 12px 32px -12px rgba(15, 23, 42, 0.16);
  --rent-shadow-3: 0 24px 60px -20px rgba(15, 23, 42, 0.30);

  /* ---- 间距（8pt 网格） ---- */
  --rent-s-1: 4px;
  --rent-s-2: 8px;
  --rent-s-3: 12px;
  --rent-s-4: 16px;
  --rent-s-5: 24px;
  --rent-s-6: 32px;
  --rent-s-7: 48px;
  --rent-s-8: 80px;

  /* ---- 字体系统 ---- */
  --rent-font-sans: "Inter", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --rent-font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", monospace;

  color-scheme: light;
}

/* ---- 暗色模式（双模变量，设计态默认 light） ---- */
.dark {
  --rent-background: #0b0f1a;
  --rent-foreground: #e8edf5;
  --rent-card: #141a26;
  --rent-card-foreground: #e8edf5;
  --rent-popover: #141a26;
  --rent-popover-foreground: #e8edf5;
  --rent-primary: #2dd4bf;
  --rent-primary-foreground: #0b0f1a;
  --rent-muted: #1c2433;
  --rent-muted-foreground: #94a3b8;
  --rent-border: #243044;
  --rent-input: #243044;
  --rent-ring: #2dd4bf;

  --rent-ink: #e8edf5;
  --rent-ink-2: #a3aec2;
  --rent-ink-3: #64748b;
  --rent-line: #243044;
  --rent-surface: #141a26;
  --rent-surface-2: #1c2433;
  --rent-sidebar: #0f1521;
  --rent-sidebar-active: #1e2a44;

  --rent-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.30);
  --rent-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.50);
  --rent-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.65);

  color-scheme: dark;
}

/* ---- 排版类 ---- */
.rent-h1 {
  font-family: var(--rent-font-sans);
  font-size: clamp(24px, 2.6vw, 32px);
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--rent-ink);
}

.rent-h2 {
  font-family: var(--rent-font-sans);
  font-size: clamp(20px, 2vw, 24px);
  line-height: 1.25;
  font-weight: 600;
  letter-spacing: -0.015em;
  color: var(--rent-ink);
}

.rent-h3 {
  font-family: var(--rent-font-sans);
  font-size: 18px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--rent-ink);
}

.rent-body-lg {
  font-family: var(--rent-font-sans);
  font-size: 16px;
  line-height: 1.6;
  font-weight: 400;
  color: var(--rent-ink-2);
}

.rent-body {
  font-family: var(--rent-font-sans);
  font-size: 14px;
  line-height: 1.6;
  font-weight: 400;
  color: var(--rent-ink-2);
}

.rent-caption {
  font-family: var(--rent-font-sans);
  font-size: 12px;
  line-height: 1.5;
  font-weight: 400;
  letter-spacing: 0.005em;
  color: var(--rent-ink-3);
}

.rent-mono {
  font-family: var(--rent-font-mono);
  font-size: 13px;
  line-height: 1.5;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}

.rent-num {
  font-family: var(--rent-font-sans);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  letter-spacing: -0.02em;
}

    <style id="rent-components">
/* ===== App Shell Layout ===== */
.rent-app {
  display: grid;
  grid-template-columns: 240px 1fr;
  grid-template-rows: 56px 1fr;
  grid-template-areas: "sidebar topbar" "sidebar main";
  height: 100vh;
  background: var(--rent-background);
}
.rent-app__sidebar { grid-area: sidebar; }
.rent-app__topbar { grid-area: topbar; }
.rent-app__main { grid-area: main; overflow-y: auto; }

/* ===== Sidebar ===== */
.rent-sidebar {
  background: var(--rent-sidebar);
  border-right: 1px solid var(--rent-border);
  display: flex;
  flex-direction: column;
  height: 100vh;
  position: sticky;
  top: 0;
}
.rent-sidebar__brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 20px;
  height: 56px;
  border-bottom: 1px solid var(--rent-border);
  flex-shrink: 0;
}
.rent-sidebar__logo {
  width: 32px; height: 32px;
  border-radius: var(--rent-radius-md);
  background: var(--rent-primary);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 16px;
  flex-shrink: 0;
}
.rent-sidebar__name {
  font-family: var(--rent-font-sans);
  font-size: 15px; font-weight: 600;
  color: var(--rent-ink);
  letter-spacing: -0.01em;
}
.rent-sidebar__nav {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  list-style: none;
  margin: 0;
}
.rent-sidebar__section-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--rent-ink-3);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 16px 12px 6px;
}
.rent-nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--rent-radius-md);
  font-size: 14px;
  font-weight: 500;
  color: var(--rent-ink-2);
  text-decoration: none;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  margin-bottom: 2px;
}
.rent-nav-item:hover { background: var(--rent-surface-2); color: var(--rent-ink); }
.rent-nav-item[data-active="true"] {
  background: var(--rent-sidebar-active);
  color: var(--rent-primary);
  font-weight: 600;
}
.rent-nav-item__icon {
  width: 18px; height: 18px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.rent-sidebar__footer {
  padding: 12px;
  border-top: 1px solid var(--rent-border);
  flex-shrink: 0;
}

/* ===== Topbar ===== */
.rent-topbar {
  background: var(--rent-surface);
  border-bottom: 1px solid var(--rent-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
  height: 56px;
  position: sticky;
  top: 0;
  z-index: 10;
}
.rent-topbar__left { display: flex; align-items: center; gap: 16px; }
.rent-topbar__title {
  font-size: 18px; font-weight: 600;
  color: var(--rent-ink);
  letter-spacing: -0.01em;
}
.rent-topbar__right { display: flex; align-items: center; gap: 12px; }
.rent-search {
  display: flex; align-items: center; gap: 8px;
  background: var(--rent-surface-2);
  border: 1px solid var(--rent-border);
  border-radius: var(--rent-radius-md);
  padding: 7px 12px;
  width: 280px;
}
.rent-search input {
  border: none; background: none; outline: none;
  font-size: 13px; color: var(--rent-ink);
  flex: 1;
  font-family: var(--rent-font-sans);
}
.rent-search input::placeholder { color: var(--rent-ink-3); }
.rent-icon-btn {
  width: 36px; height: 36px;
  border: 1px solid var(--rent-border);
  border-radius: var(--rent-radius-md);
  background: var(--rent-surface);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  position: relative;
  transition: background 0.15s;
}
.rent-icon-btn:hover { background: var(--rent-surface-2); }
.rent-icon-btn__badge {
  position: absolute;
  top: -2px; right: -2px;
  width: 16px; height: 16px;
  border-radius: var(--rent-radius-full);
  background: var(--state-error);
  color: #fff;
  font-size: 10px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
}
.rent-avatar {
  width: 32px; height: 32px;
  border-radius: var(--rent-radius-full);
  background: var(--rent-primary);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 600;
  flex-shrink: 0;
}
.rent-avatar--sm { width: 28px; height: 28px; font-size: 12px; }
.rent-avatar--lg { width: 48px; height: 48px; font-size: 18px; }

/* ===== Main Content ===== */
.rent-main {
  padding: 24px;
  max-width: 100%;
}
.rent-page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 24px;
  gap: 16px;
}
.rent-page-header__title {
  font-size: 24px; font-weight: 600;
  color: var(--rent-ink);
  letter-spacing: -0.02em;
  margin: 0 0 4px;
}
.rent-page-header__subtitle {
  font-size: 14px;
  color: var(--rent-ink-3);
}
.rent-page-header__actions {
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}

/* ===== Card ===== */
.rent-card {
  background: var(--rent-card);
  border: 1px solid var(--rent-border);
  border-radius: var(--rent-radius-lg);
  overflow: hidden;
}
.rent-card__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--rent-border);
}
.rent-card__title {
  font-size: 16px; font-weight: 600;
  color: var(--rent-ink);
  margin: 0;
}
.rent-card__body { padding: 20px; }
.rent-card__footer {
  padding: 12px 20px;
  border-top: 1px solid var(--rent-border);
  background: var(--rent-surface-2);
}

/* ===== Button ===== */
.rent-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--rent-radius-md);
  font-size: 14px;
  font-weight: 500;
  font-family: var(--rent-font-sans);
  border: 1px solid transparent;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
  text-decoration: none;
  white-space: nowrap;
  line-height: 1.4;
}
.rent-btn--primary {
  background: var(--rent-primary);
  color: var(--rent-primary-foreground);
}
.rent-btn--primary:hover { background: #0d9488; }
.rent-btn--secondary {
  background: var(--rent-surface);
  border-color: var(--rent-border);
  color: var(--rent-ink);
}
.rent-btn--secondary:hover { background: var(--rent-surface-2); }
.rent-btn--ghost {
  background: transparent;
  color: var(--rent-ink-2);
}
.rent-btn--ghost:hover { background: var(--rent-surface-2); }
.rent-btn--danger {
  background: var(--state-error);
  color: #fff;
}
.rent-btn--danger:hover { background: #b91c1c; }
.rent-btn--success {
  background: var(--state-success);
  color: #fff;
}
.rent-btn--sm { padding: 5px 12px; font-size: 13px; }
.rent-btn--lg { padding: 12px 24px; font-size: 15px; }
.rent-btn--block { width: 100%; }
.rent-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ===== Table ===== */
.rent-table-wrap {
  overflow-x: auto;
  border-radius: var(--rent-radius-lg);
  border: 1px solid var(--rent-border);
}
.rent-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.rent-table thead th {
  background: var(--rent-surface-2);
  padding: 12px 16px;
  text-align: left;
  font-weight: 600;
  font-size: 13px;
  color: var(--rent-ink-2);
  border-bottom: 1px solid var(--rent-border);
  white-space: nowrap;
}
.rent-table tbody td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--rent-border);
  color: var(--rent-ink);
  vertical-align: middle;
}
.rent-table tbody tr:last-child td { border-bottom: none; }
.rent-table tbody tr:hover { background: var(--rent-surface-2); }
.rent-table__mono { font-family: var(--rent-font-mono); font-size: 13px; }

/* ===== Badge ===== */
.rent-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: var(--rent-radius-full);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.4;
}
.rent-badge--success { background: rgba(22,163,74,0.1); color: var(--state-success); }
.rent-badge--warning { background: rgba(217,119,6,0.1); color: var(--state-warning); }
.rent-badge--error { background: rgba(220,38,38,0.1); color: var(--state-error); }
.rent-badge--info { background: rgba(14,165,233,0.1); color: var(--state-info); }
.rent-badge--neutral { background: var(--rent-surface-2); color: var(--rent-ink-2); }
.rent-badge--primary { background: rgba(20,184,166,0.1); color: var(--rent-primary); }
.rent-badge--dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }

/* ===== KPI / Stat Card ===== */
.rent-stat-card {
  background: var(--rent-card);
  border: 1px solid var(--rent-border);
  border-radius: var(--rent-radius-lg);
  padding: 20px;
}
.rent-stat-card__label {
  font-size: 13px;
  color: var(--rent-ink-3);
  margin-bottom: 8px;
}
.rent-stat-card__value {
  font-size: 28px;
  font-weight: 700;
  color: var(--rent-ink);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.rent-stat-card__delta {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 500;
  margin-top: 8px;
}
.rent-stat-card__delta--up { color: var(--state-success); }
.rent-stat-card__delta--down { color: var(--state-error); }
.rent-stat-card__icon {
  width: 40px; height: 40px;
  border-radius: var(--rent-radius-md);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

/* ===== Grid Utilities ===== */
.rent-grid { display: grid; gap: 16px; }
.rent-grid--2 { grid-template-columns: repeat(2, 1fr); }
.rent-grid--3 { grid-template-columns: repeat(3, 1fr); }
.rent-grid--4 { grid-template-columns: repeat(4, 1fr); }
.rent-grid--auto { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }

/* ===== Misc ===== */
.rent-divider { height: 1px; background: var(--rent-border); margin: 16px 0; border: none; }
.rent-empty {
  text-align: center;
  padding: 48px 20px;
  color: var(--rent-ink-3);
}
.rent-tabs {
  display: flex;
  gap: 0;
  border-bottom: 1px solid var(--rent-border);
  margin-bottom: 20px;
}
.rent-tab {
  padding: 10px 16px;
  font-size: 14px;
  font-weight: 500;
  color: var(--rent-ink-3);
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
}
.rent-tab:hover { color: var(--rent-ink); }
.rent-tab[data-active="true"] {
  color: var(--rent-primary);
  border-bottom-color: var(--rent-primary);
}
.rent-progress {
  width: 100%;
  height: 6px;
  background: var(--rent-surface-2);
  border-radius: var(--rent-radius-full);
  overflow: hidden;
}
.rent-progress__bar {
  height: 100%;
  background: var(--rent-primary);
  border-radius: var(--rent-radius-full);
  transition: width 0.3s;
}

/* ===== Utility ===== */
.rent-flex { display: flex; }
.rent-flex--center { align-items: center; justify-content: center; }
.rent-flex--between { align-items: center; justify-content: space-between; }
.rent-flex--col { flex-direction: column; }
.rent-gap-2 { gap: 8px; }
.rent-gap-3 { gap: 12px; }
.rent-gap-4 { gap: 16px; }
.rent-mt-2 { margin-top: 8px; }
.rent-mt-3 { margin-top: 12px; }
.rent-mt-4 { margin-top: 16px; }
.rent-mt-5 { margin-top: 24px; }
.rent-mb-2 { margin-bottom: 8px; }
.rent-mb-3 { margin-bottom: 12px; }
.rent-mb-4 { margin-bottom: 16px; }
.rent-mb-5 { margin-bottom: 24px; }
.rent-text-right { text-align: right; }
.rent-text-center { text-align: center; }
.rent-text-sm { font-size: 13px; }
.rent-text-muted { color: var(--rent-ink-3); }
.rent-text-bold { font-weight: 600; }
.rent-w-full { width: 100%; }

/* ===== Timeline ===== */
.rent-timeline { position: relative; padding-left: 24px; }
.rent-timeline::before {
  content: "";
  position: absolute;
  left: 7px; top: 4px; bottom: 4px;
  width: 2px;
  background: var(--rent-border);
}
.rent-timeline__item {
  position: relative;
  padding-bottom: 20px;
}
.rent-timeline__item:last-child { padding-bottom: 0; }
.rent-timeline__dot {
  position: absolute;
  left: -24px; top: 4px;
  width: 16px; height: 16px;
  border-radius: 50%;
  border: 3px solid var(--rent-surface);
  box-shadow: 0 0 0 2px var(--rent-border);
  background: var(--rent-ink-3);
}
.rent-timeline__dot--success { background: var(--state-success); box-shadow: 0 0 0 2px rgba(22,163,74,0.2); }
.rent-timeline__dot--info { background: var(--state-info); box-shadow: 0 0 0 2px rgba(14,165,233,0.2); }
.rent-timeline__dot--warning { background: var(--state-warning); box-shadow: 0 0 0 2px rgba(217,119,6,0.2); }
.rent-timeline__dot--neutral { background: var(--rent-ink-3); box-shadow: 0 0 0 2px var(--rent-border); }

/* ===== Portal Shell ===== */
.rent-portal {
  min-height: 100vh;
  background: var(--rent-background);
}
.rent-portal__header {
  background: var(--rent-surface);
  border-bottom: 1px solid var(--rent-border);
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 40px;
  position: sticky;
  top: 0;
  z-index: 50;
  box-shadow: var(--rent-shadow-1);
}
.rent-portal__brand {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.rent-portal__logo {
  width: 36px;
  height: 36px;
  border-radius: var(--rent-radius-md);
  background: var(--rent-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 700;
  font-size: 18px;
  flex-shrink: 0;
}
.rent-portal__name {
  font-size: 18px;
  font-weight: 600;
  color: var(--rent-ink);
  letter-spacing: -0.01em;
}
.rent-portal__nav {
  display: flex;
  align-items: center;
  gap: 4px;
}
.rent-portal__nav-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: var(--rent-radius-md);
  font-size: 14px;
  font-weight: 500;
  color: var(--rent-ink-2);
  text-decoration: none;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  white-space: nowrap;
}
.rent-portal__nav-item:hover { background: var(--rent-surface-2); color: var(--rent-ink); }
.rent-portal__nav-item[data-active="true"] {
  color: var(--rent-primary);
  font-weight: 600;
  background: var(--rent-sidebar-active);
}
.rent-portal__nav-icon { width: 18px; height: 18px; flex-shrink: 0; }
.rent-portal__actions {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.rent-portal__main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 32px 40px;
}
.rent-portal__user {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}

/* =========================================================
   消费级门户组件 (Consumer-grade portal components)
   ========================================================= */

/* ----- Section frame ----- */
.rent-section { margin-bottom: 32px; }
.rent-section:last-child { margin-bottom: 0; }
.rent-section__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  gap: 16px;
}
.rent-section__title {
  font-size: 20px;
  font-weight: 600;
  color: var(--rent-ink);
  letter-spacing: -0.015em;
  margin: 0;
}
.rent-section__link {
  font-size: 14px;
  font-weight: 500;
  color: var(--rent-primary);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: opacity 0.15s;
}
.rent-section__link:hover { opacity: 0.75; }

/* ----- Hero (大视觉渐变卡片) ----- */
.rent-hero {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, #14b8a6 0%, #5b3fd6 55%, #7c3aed 100%);
  border-radius: 24px;
  padding: 40px;
  margin-bottom: 32px;
  color: #fff;
  box-shadow: 0 20px 50px -20px rgba(20,184,166, 0.55);
}
.rent-hero__decor {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}
.rent-hero__decor--1 {
  width: 340px; height: 340px;
  top: -130px; right: -90px;
  background: rgba(255, 255, 255, 0.10);
}
.rent-hero__decor--2 {
  width: 220px; height: 220px;
  bottom: -110px; right: 200px;
  background: rgba(255, 255, 255, 0.06);
}
.rent-hero__decor--3 {
  width: 130px; height: 130px;
  top: 30px; right: 320px;
  border: 2px solid rgba(255, 255, 255, 0.14);
  background: transparent;
}
.rent-hero__inner {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 28px;
  flex-wrap: wrap;
}
.rent-hero__greeting { flex: 1; min-width: 240px; }
.rent-hero__hi {
  font-size: 13px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.82);
  margin: 0 0 10px;
  letter-spacing: 0.02em;
}
.rent-hero__title {
  font-size: 32px;
  font-weight: 700;
  margin: 0 0 16px;
  letter-spacing: -0.02em;
  line-height: 1.15;
  color: #fff;
}
.rent-hero__property {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 14px;
  background: rgba(255, 255, 255, 0.14);
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: var(--rent-radius-full);
  font-size: 14px;
  font-weight: 500;
  color: #fff;
  margin: 0;
}
.rent-hero__panels {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}
.rent-hero__panel {
  background: rgba(255, 255, 255, 0.12);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 16px;
  padding: 18px 22px;
  min-width: 190px;
  backdrop-filter: blur(6px);
}
.rent-hero__panel-label {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.75);
  margin-bottom: 6px;
  letter-spacing: 0.02em;
}
.rent-hero__panel-value {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.rent-hero__panel-value small {
  font-size: 14px;
  font-weight: 500;
  opacity: 0.85;
}
.rent-hero__panel-tag {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.85);
  margin-top: 6px;
}
.rent-hero__lease-bar {
  height: 6px;
  width: 100%;
  background: rgba(255, 255, 255, 0.22);
  border-radius: var(--rent-radius-full);
  overflow: hidden;
  margin-top: 10px;
}
.rent-hero__lease-fill {
  height: 100%;
  background: linear-gradient(90deg, #ffffff, #c7d2fe);
  border-radius: var(--rent-radius-full);
}
.rent-hero__cta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 22px;
  border-radius: var(--rent-radius-full);
  background: #fff;
  color: var(--rent-primary);
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
  transition: transform 0.15s, box-shadow 0.15s;
  box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.3);
}
.rent-hero__cta:hover { transform: translateY(-1px); }

/* ----- Quick actions 2x2 ----- */
.rent-quick-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
}
.rent-quick-card {
  background: var(--rent-card);
  border: 1px solid var(--rent-border);
  border-radius: 16px;
  padding: 24px;
  display: flex;
  align-items: center;
  gap: 18px;
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
}
.rent-quick-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--rent-shadow-2);
  border-color: transparent;
}
.rent-quick-card__icon {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.rent-quick-card__body { flex: 1; min-width: 0; }
.rent-quick-card__title {
  font-size: 16px;
  font-weight: 600;
  color: var(--rent-ink);
  margin: 0 0 4px;
}
.rent-quick-card__desc {
  font-size: 13px;
  color: var(--rent-ink-3);
}
.rent-quick-card__arrow {
  color: var(--rent-ink-3);
  flex-shrink: 0;
  transition: transform 0.2s, color 0.2s;
}
.rent-quick-card:hover .rent-quick-card__arrow {
  color: var(--rent-primary);
  transform: translateX(3px);
}

/* ----- Lease visualized card ----- */
.rent-lease { padding: 24px; }
.rent-lease__top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  gap: 12px;
}
.rent-lease__heading {
  font-size: 18px;
  font-weight: 600;
  color: var(--rent-ink);
  margin: 0;
}
.rent-lease__stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 22px;
}
.rent-lease__stat-label {
  font-size: 12px;
  color: var(--rent-ink-3);
  margin-bottom: 6px;
  letter-spacing: 0.02em;
}
.rent-lease__stat-value {
  font-size: 18px;
  font-weight: 600;
  color: var(--rent-ink);
  letter-spacing: -0.01em;
}
.rent-lease__stat-value--mono {
  font-family: var(--rent-font-mono);
  font-size: 17px;
}
.rent-lease__progress-wrap {
  background: var(--rent-surface-2);
  border-radius: 12px;
  padding: 16px 18px;
}
.rent-lease__progress-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.rent-lease__progress-label {
  font-size: 13px;
  color: var(--rent-ink-2);
  font-weight: 500;
}
.rent-lease__progress-days {
  font-size: 13px;
  font-weight: 600;
  color: var(--rent-primary);
  white-space: nowrap;
}
.rent-lease__progress {
  height: 8px;
  background: var(--rent-border);
  border-radius: var(--rent-radius-full);
  overflow: hidden;
}
.rent-lease__progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--rent-primary), #7c3aed);
  border-radius: var(--rent-radius-full);
}
.rent-lease__progress-foot {
  font-size: 12px;
  color: var(--rent-ink-3);
  margin-top: 8px;
}

/* ----- Reminder cards ----- */
.rent-reminders {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 24px;
}
.rent-reminder {
  position: relative;
  display: flex;
  gap: 14px;
  padding: 14px 16px 14px 18px;
  background: var(--rent-surface-2);
  border-radius: 12px;
  overflow: hidden;
}
.rent-reminder::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 4px;
}
.rent-reminder--warning::before { background: var(--state-warning); }
.rent-reminder--info::before { background: var(--state-info); }
.rent-reminder--neutral::before { background: var(--rent-ink-3); }
.rent-reminder__icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.rent-reminder--warning .rent-reminder__icon { background: rgba(217, 119, 6, 0.12); color: var(--state-warning); }
.rent-reminder--info .rent-reminder__icon { background: rgba(14, 165, 233, 0.12); color: var(--state-info); }
.rent-reminder--neutral .rent-reminder__icon { background: rgba(148, 163, 184, 0.15); color: var(--rent-ink-2); }
.rent-reminder__body { flex: 1; min-width: 0; }
.rent-reminder__title {
  font-size: 14px;
  font-weight: 600;
  color: var(--rent-ink);
  margin: 0 0 3px;
}
.rent-reminder__desc {
  font-size: 13px;
  color: var(--rent-ink-2);
}
.rent-reminder__date {
  font-size: 12px;
  color: var(--rent-ink-3);
  white-space: nowrap;
  flex-shrink: 0;
  align-self: center;
}

/* ----- Maintenance cards (horizontal flow) ----- */
.rent-maint-flow {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}
.rent-maint-card {
  background: var(--rent-card);
  border: 1px solid var(--rent-border);
  border-radius: 16px;
  padding: 20px;
  transition: box-shadow 0.2s, transform 0.2s;
  cursor: pointer;
}
.rent-maint-card:hover {
  box-shadow: var(--rent-shadow-2);
  transform: translateY(-2px);
}
.rent-maint-card__top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.rent-maint-card__id {
  font-family: var(--rent-font-mono);
  font-size: 13px;
  color: var(--rent-ink-3);
}
.rent-maint-card__status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 500;
}
.rent-status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  display: inline-block;
}
.rent-maint-card__title {
  font-size: 16px;
  font-weight: 600;
  color: var(--rent-ink);
  margin: 0 0 16px;
}
.rent-maint-card__foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 14px;
  border-top: 1px solid var(--rent-border);
}
.rent-maint-card__prio {
  font-size: 13px;
  font-weight: 500;
}
.rent-maint-card__date {
  font-size: 13px;
  color: var(--rent-ink-3);
}

/* ----- Two-column row ----- */
.rent-row-2 {
  display: grid;
  grid-template-columns: 1.15fr 1fr;
  gap: 24px;
  align-items: start;
}

/* =========================================================
   找房源页面 — 搜索 / 筛选 / 房源卡片 / 分页组件
   ========================================================= */

/* ----- Search Hero ----- */
.rent-search-hero {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, #14b8a6 0%, #5b3fd6 55%, #7c3aed 100%);
  border-radius: 24px;
  padding: 48px 40px 40px;
  margin-bottom: 24px;
  color: #fff;
  box-shadow: 0 20px 50px -20px rgba(20,184,166, 0.55);
}
.rent-search-hero__decor {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}
.rent-search-hero__decor--1 {
  width: 380px; height: 380px;
  top: -150px; right: -110px;
  background: rgba(255, 255, 255, 0.10);
}
.rent-search-hero__decor--2 {
  width: 260px; height: 260px;
  bottom: -130px; right: 220px;
  background: rgba(255, 255, 255, 0.06);
}
.rent-search-hero__decor--3 {
  width: 150px; height: 150px;
  top: 50px; right: 360px;
  border: 2px solid rgba(255, 255, 255, 0.14);
  background: transparent;
}
.rent-search-hero__inner {
  position: relative;
  z-index: 1;
  max-width: 680px;
}
.rent-search-hero__title {
  font-size: 38px;
  font-weight: 700;
  margin: 0 0 8px;
  letter-spacing: -0.02em;
  line-height: 1.15;
  color: #fff;
}
.rent-search-hero__subtitle {
  font-size: 16px;
  color: rgba(255, 255, 255, 0.85);
  margin: 0 0 28px;
}
.rent-search-hero__bar {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #fff;
  border-radius: var(--rent-radius-full);
  padding: 6px 6px 6px 22px;
  box-shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.35);
}
.rent-search-hero__bar input {
  flex: 1;
  border: none;
  background: none;
  outline: none;
  font-size: 15px;
  color: var(--rent-ink);
  font-family: var(--rent-font-sans);
  padding: 10px 0;
}
.rent-search-hero__bar input::placeholder { color: var(--rent-ink-3); }
.rent-search-hero__search-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 11px 26px;
  border-radius: var(--rent-radius-full);
  background: var(--rent-primary);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: background 0.15s;
  flex-shrink: 0;
  font-family: var(--rent-font-sans);
}
.rent-search-hero__search-btn:hover { background: #0d9488; }
.rent-search-hero__tags {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 20px;
}
.rent-search-hero__tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 14px;
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: var(--rent-radius-full);
  font-size: 13px;
  font-weight: 500;
  color: #fff;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  text-decoration: none;
}
.rent-search-hero__tag:hover { background: rgba(255, 255, 255, 0.26); border-color: rgba(255,255,255,0.4); }

/* ----- Filter Bar (sticky below header) ----- */
.rent-filter-bar {
  position: sticky;
  top: 64px;
  z-index: 30;
  background: var(--rent-surface);
  border: 1px solid var(--rent-border);
  border-radius: var(--rent-radius-lg);
  padding: 14px 20px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  box-shadow: var(--rent-shadow-1);
}
.rent-filter-bar__chips {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.rent-filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: var(--rent-radius-full);
  background: var(--rent-surface-2);
  border: 1px solid var(--rent-border);
  font-size: 13px;
  font-weight: 500;
  color: var(--rent-ink);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  white-space: nowrap;
  font-family: var(--rent-font-sans);
}
.rent-filter-chip:hover {
  background: var(--rent-surface);
  border-color: var(--rent-primary);
  color: var(--rent-primary);
}
.rent-filter-chip--active {
  background: var(--rent-sidebar-active);
  border-color: var(--rent-primary);
  color: var(--rent-primary);
}
.rent-filter-chip__chevron {
  display: inline-flex;
  align-items: center;
  opacity: 0.6;
}
.rent-filter-bar__right {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}
.rent-view-toggle {
  display: inline-flex;
  background: var(--rent-surface-2);
  border-radius: var(--rent-radius-md);
  padding: 3px;
