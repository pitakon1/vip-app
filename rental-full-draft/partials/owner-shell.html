<!-- ============================================================
     OWNER SHELL — 业主侧边栏 + 顶栏 + 主内容框架
     Leaf pages: Copy this structure into <body>.
     Slots to fill:
       <!-- SLOT: pageTitle -->    → topbar title text
       <!-- SLOT: mainContent -->  → page-specific content
     Active nav: Set data-active="true" on the matching data-nav-key item.
     ============================================================ -->
<div class="rent-app">
  <!-- ===== Sidebar ===== -->
  <aside class="rent-app__sidebar">
    <div class="rent-sidebar">
      <div class="rent-sidebar__brand">
        <img class="rent-sidebar__logo" src="../assets/haofang-logo.jpg" alt="HaoFang.World" style="width:auto;max-height:34px;object-fit:contain;border-radius:6px;background:#fff;padding:3px;flex-shrink:0;display:inline-block;">
        <span class="rent-sidebar__name">业主端</span>
      </div>
      <nav class="rent-sidebar__nav">
        <div class="rent-sidebar__section-label">我的房产</div>
        <a class="rent-nav-item" data-nav-key="owner-dashboard" href="#" data-dom-id="nav-owner-dashboard">
          <svg class="rent-nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span>业主首页</span>
        </a>
        <a class="rent-nav-item" data-nav-key="owner-income" href="#" data-dom-id="nav-owner-income">
          <svg class="rent-nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          <span>租金收入</span>
        </a>
        <a class="rent-nav-item" data-nav-key="owner-documents" href="#" data-dom-id="nav-owner-documents">
          <svg class="rent-nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span>我的文档</span>
        </a>
        <div class="rent-sidebar__section-label">增值服务</div>
        <a class="rent-nav-item" data-nav-key="owner-services" href="#" data-dom-id="nav-owner-services">
          <svg class="rent-nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
          <span>推荐服务</span>
        </a>
        <a class="rent-nav-item" data-nav-key="owner-payments" href="#" data-dom-id="nav-owner-payments">
          <svg class="rent-nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          <span>在线付款</span>
        </a>
      </nav>
      <div class="rent-sidebar__footer">
        <div class="rent-flex rent-flex--between rent-gap-3">
          <div class="rent-flex rent-gap-2" style="align-items:center;">
            <div class="rent-avatar rent-avatar--sm">业</div>
            <div>
              <div class="rent-text-sm rent-text-bold">陈业主</div>
              <div class="rent-text-sm rent-text-muted">owner@rentflow.com</div>
            </div>
          </div>
          <a href="login.html" class="rent-btn rent-btn--ghost rent-btn--sm" data-dom-id="back-login">退出</a>
        </div>
      </div>
    </div>
  </aside>

  <!-- ===== Topbar ===== -->
  <header class="rent-app__topbar">
    <div class="rent-topbar">
      <div class="rent-topbar__left">
        <h1 class="rent-topbar__title"><!-- SLOT: pageTitle --></h1>
      </div>
      <div class="rent-topbar__right">
        <div class="rent-search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--rent-ink-3)" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="搜索房产、收入记录...">
        </div>
        <button class="rent-icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--rent-ink-2)" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="rent-icon-btn__badge">2</span>
        </button>
        <div class="rent-avatar">业</div>
      </div>
    </div>
  </header>

  <!-- ===== Main Content ===== -->
  <main class="rent-app__main">
    <div class="rent-main">
      <!-- SLOT: mainContent -->
    </div>
  </main>
</div>
