<!-- ============================================================
     ADMIN SHELL — 管理员侧边栏 + 顶栏 + 主内容框架

<div class="rent-app">
  <!-- ===== Sidebar ===== -->
  <aside class="rent-app__sidebar">
    <div class="rent-sidebar">
      <div class="rent-sidebar__brand">
        <div class="rent-sidebar__logo">R</div>

          <span>数据总览</span>
        </a>
        <div class="rent-sidebar__section-label">业务管理</div>
        <a class="rent-nav-item" data-nav-key="admin-properties" href="#" data-dom-id="nav-admin-properties">
          <svg class="rent-nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>房源管理</span>
        </a>
        <a class="rent-nav-item" data-nav-key="admin-crm" href="#" data-dom-id="nav-admin-crm">
          <svg class="rent-nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>客户管理</span>
        </a>
        <a class="rent-nav-item" data-nav-key="admin-leases" href="#" data-dom-id="nav-admin-leases">
          <svg class="rent-nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>

        </a>
        <a class="rent-nav-item" data-nav-key="admin-payments" href="#" data-dom-id="nav-admin-payments">
          <svg class="rent-nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
          <span>收付款管理</span>
        </a>
        <div class="rent-sidebar__section-label">系统</div>
        <a class="rent-nav-item" data-nav-key="admin-employees" href="#" data-dom-id="nav-admin-employees">
          <svg class="rent-nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>员工管理</span>
        </a>
        <a class="rent-nav-item" data-nav-key="admin-settings" href="#" data-dom-id="nav-admin-settings">

          <span>系统设置</span>
        </a>
      </nav>
      <div class="rent-sidebar__footer">
        <div class="rent-flex rent-flex--between rent-gap-3">
          <div class="rent-flex rent-gap-2" style="align-items:center;">
            <div class="rent-avatar rent-avatar--sm">管</div>
            <div>
              <div class="rent-text-sm rent-text-bold">管理员</div>
              <div class="rent-text-sm rent-text-muted">admin@rentflow.com</div>
            </div>
          </div>
          <a href="#" class="rent-btn rent-btn--ghost rent-btn--sm" data-dom-id="back-login">退出</a>
        </div>
      </div>
    </div>
  </aside>

  <!-- ===== Topbar ===== -->
  <header class="rent-app__topbar">
    <div class="rent-topbar">
      <div class="rent-topbar__left">
        <h1 class="rent-topbar__title"><!-- SLOT: pageTitle --></h1>
      </div>
      <div class="rent-topbar__right">
        <div class="rent-search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--rent-ink-3)" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="搜索房源、客户、合同...">
        </div>
        <button class="rent-icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--rent-ink-2)" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="rent-icon-btn__badge">3</span>
        </button>
        <div class="rent-avatar">管</div>
      </div>
    </div>
  </header>

  <!-- ===== Main Content ===== -->
  <main class="rent-app__main">
    <div class="rent-main">
      <!-- SLOT: mainContent -->
    </div>
  </main>
</div>
