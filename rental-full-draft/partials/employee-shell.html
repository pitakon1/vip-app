<!-- ============================================================
     EMPLOYEE SHELL — 员工侧边栏 + 顶栏 + 主内容框架
     Leaf pages: Copy this structure into <body>.
     Slots to fill:
       <!-- SLOT: pageTitle -->    → topbar title text
       <!-- SLOT: mainContent -->  → page-specific content
     Active nav: Set data-active="true" on the matching data-nav-key item.
     ============================================================ -->
<div class="rent-app">
  <!-- ===== Sidebar ===== -->
  <aside class="rent-app__sidebar">
    <div class="rent-sidebar">
      <div class="rent-sidebar__brand">
        <div class="rent-sidebar__logo">R</div>
        <span class="rent-sidebar__name">RentFlow 员工端</span>
      </div>
      <nav class="rent-sidebar__nav">
        <div class="rent-sidebar__section-label">工作台</div>
        <a class="rent-nav-item" data-nav-key="employee-dashboard" href="#" data-dom-id="nav-employee-dashboard">
          <svg class="rent-nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span>销售台账</span>
        </a>
        <a class="rent-nav-item" data-nav-key="employee-attendance" href="#" data-dom-id="nav-employee-attendance">
          <svg class="rent-nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>考勤打卡</span>
        </a>
        <a class="rent-nav-item" data-nav-key="employee-properties" href="#" data-dom-id="nav-employee-properties">
          <svg class="rent-nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>房源浏览</span>
        </a>
        <div class="rent-sidebar__section-label">绩效</div>
        <a class="rent-nav-item" data-nav-key="employee-performance" href="#" data-dom-id="nav-employee-performance">
          <svg class="rent-nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 6l-9.5 9.5-5-5L1 18"/><polyline points="17 6 23 6 23 12"/></svg>
          <span>业绩报表</span>
        </a>
        <a class="rent-nav-item" data-nav-key="employee-contacts" href="#" data-dom-id="nav-employee-contacts">
          <svg class="rent-nav-item__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span>同事通讯录</span>
        </a>
      </nav>
      <div class="rent-sidebar__footer">
        <div class="rent-flex rent-flex--between rent-gap-3">
          <div class="rent-flex rent-gap-2" style="align-items:center;">
            <div class="rent-avatar rent-avatar--sm">员</div>
            <div>
              <div class="rent-text-sm rent-text-bold">李员工</div>
              <div class="rent-text-sm rent-text-muted">employee@rentflow.com</div>
            </div>
          </div>
          <a href="#" class="rent-btn rent-btn--ghost rent-btn--sm" data-dom-id="back-login">退出</a>
        </div>
      </div>
    </div>
  </aside>

  <!-- ===== Topbar ===== -->
  <header class="rent-app__topbar">
    <div class="rent-topbar">
      <div class="rent-topbar__left">
        <h1 class="rent-topbar__title"><!-- SLOT: pageTitle --></h1>
      </div>
      <div class="rent-topbar__right">
        <div class="rent-search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--rent-ink-3)" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="搜索客户、合同、同事...">
        </div>
        <button class="rent-icon-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--rent-ink-2)" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="rent-icon-btn__badge">5</span>
        </button>
        <div class="rent-avatar">员</div>
      </div>
    </div>
  </header>

  <!-- ===== Main Content ===== -->
  <main class="rent-app__main">
    <div class="rent-main">
      <!-- SLOT: mainContent -->
    </div>
  </main>
</div>
