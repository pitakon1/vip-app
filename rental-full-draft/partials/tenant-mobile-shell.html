<!-- ============================================================
     TENANT MOBILE SHELL — 租客移动端 App 布局
     手机 App 风格 · 紧凑顶栏 · 底部 Tab 导航 · 大卡片
     Max-width 430px 居中模拟手机屏幕
     Leaf pages: Copy the <style> block + HTML structure into page.
     Slots:
       <!-- SLOT: pageTitle -->    → header title
       <!-- SLOT: mainContent -->  → page-specific content
       <!-- SLOT: activeTab -->    → set data-active="true" on matching tab
     ============================================================ -->

<!-- ===== Additional CSS for Mobile App Layout (add to <style id="rent-components">) ===== -->
<!--
.rent-mobile {
  max-width: 430px;
  margin: 0 auto;
  min-height: 100vh;
  background: var(--rent-background);
  position: relative;
  padding-bottom: 72px;
  box-shadow: 0 0 40px rgba(15, 23, 42, 0.08);
}
.rent-mobile__header {
  background: var(--rent-surface);
  border-bottom: 1px solid var(--rent-border);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
}
.rent-mobile__header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.rent-mobile__logo {
  width: 32px;
  height: 32px;
  border-radius: var(--rent-radius-md);
  background: var(--rent-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-weight: 700;
  font-size: 16px;
  flex-shrink: 0;
}
.rent-mobile__title {
  font-size: 17px;
  font-weight: 600;
  color: var(--rent-ink);
  letter-spacing: -0.01em;
}
.rent-mobile__header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
.rent-mobile__main {
  padding: 16px;
}
.rent-mobile__bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  background: var(--rent-surface);
  border-top: 1px solid var(--rent-border);
  display: flex;
  justify-content: space-around;
  padding: 8px 0 12px;
  z-index: 50;
  box-shadow: 0 -4px 12px rgba(15, 23, 42, 0.06);
}
.rent-mobile__tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 4px 8px;
  font-size: 10px;
  font-weight: 500;
  color: var(--rent-ink-3);
  text-decoration: none;
  cursor: pointer;
  transition: color 0.15s;
  flex: 1;
}
.rent-mobile__tab:hover { color: var(--rent-ink-2); }
.rent-mobile__tab[data-active="true"] { color: var(--rent-primary); }
.rent-mobile__tab-icon { width: 22px; height: 22px; flex-shrink: 0; }

/* Mobile card */
.rent-mobile__card {
  background: var(--rent-card);
  border: 1px solid var(--rent-border);
  border-radius: var(--rent-radius-lg);
  padding: 16px;
  margin-bottom: 12px;
}
.rent-mobile__card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.rent-mobile__card-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--rent-ink);
  margin: 0;
}
.rent-mobile__section-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--rent-ink);
  margin: 20px 0 12px;
  letter-spacing: -0.01em;
}
.rent-mobile__section-title:first-child { margin-top: 0; }

/* Mobile list item */
.rent-mobile__list-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--rent-border);
}
.rent-mobile__list-item:last-child { border-bottom: none; }

/* Mobile quick action grid */
.rent-mobile__quick-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.rent-mobile__quick-action {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 4px;
  background: var(--rent-surface);
  border: 1px solid var(--rent-border);
  border-radius: var(--rent-radius-md);
  text-decoration: none;
  cursor: pointer;
  transition: background 0.15s;
}
.rent-mobile__quick-action:hover { background: var(--rent-surface-2); }
.rent-mobile__quick-action-icon {
  width: 36px;
  height: 36px;
  border-radius: var(--rent-radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.rent-mobile__quick-action-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--rent-ink-2);
  text-align: center;
  line-height: 1.3;
}

/* Mobile hero banner */
.rent-mobile__hero {
  background: linear-gradient(135deg, var(--rent-primary) 0%, #3b51d4 100%);
  border-radius: var(--rent-radius-lg);
  padding: 20px;
  margin-bottom: 16px;
  color: #fff;
}
.rent-mobile__hero-greeting {
  font-size: 20px;
  font-weight: 700;
  margin: 0 0 4px;
  color: #fff;
  letter-spacing: -0.02em;
}
.rent-mobile__hero-sub {
  font-size: 13px;
  color: rgba(255,255,255,0.85);
  margin: 0 0 16px;
}
.rent-mobile__hero-stats {
  display: flex;
  gap: 16px;
}
.rent-mobile__hero-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.rent-mobile__hero-stat-label {
  font-size: 11px;
  color: rgba(255,255,255,0.7);
}
.rent-mobile__hero-stat-value {
  font-size: 16px;
  font-weight: 700;
  color: #fff;
  font-variant-numeric: tabular-nums;
}

/* Mobile stat row */
.rent-mobile__stat-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.rent-mobile__stat {
  background: var(--rent-card);
  border: 1px solid var(--rent-border);
  border-radius: var(--rent-radius-md);
  padding: 14px;
}
.rent-mobile__stat-label {
  font-size: 12px;
  color: var(--rent-ink-3);
  margin-bottom: 4px;
}
.rent-mobile__stat-value {
  font-size: 20px;
  font-weight: 700;
  color: var(--rent-ink);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.rent-mobile__stat-badge {
  display: inline-block;
  margin-top: 4px;
}

/* Mobile FAB */
.rent-mobile__fab {
  position: fixed;
  bottom: 84px;
  left: 50%;
  transform: translateX(calc(215px - 28px));
  width: 48px;
  height: 48px;
  border-radius: var(--rent-radius-full);
  background: var(--rent-primary);
  color: #fff;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: var(--rent-shadow-2);
  z-index: 40;
  transition: background 0.15s;
}
.rent-mobile__fab:hover { background: #3b51d4; }
-->
