# Nginx 生产配置：托管前端静态产物 + 反向代理后端 API
# 适用于单机部署：Nginx 统一入口，静态资源强缓存，/api 与 /uploads 反代到 FastAPI
#
# 安全基线：
#   1) 隐藏版本号，避免按版本号匹配已知漏洞（server_tokens off）；
#   2) 统一安全响应头，降低 XSS / 点击劫持 / MIME 嗅探风险；
#   3) 限制请求体大小，挡住超大 body 打满磁盘/内存；
#   4) 入口层限流，作为后端 slowapi 之外的又一道闸；
#   5) 公网部署必须启用 HTTPS（见文件末尾的 443 模板）。

# ---- 入口层限流（http 上下文，conf.d 文件默认被 include 进 http{}） ----
# 与后端 slowapi 是互补关系：Nginx 这层在连接最前面挡掉突发流量，
# 后端那层做业务维度的精细限额（如登录/OTP 等凭证类接口）。
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    # 不暴露 nginx 版本号
    server_tokens off;

    # 请求体上限：后端单文件最大 20MB（documents），留一点余量到 25MB。
    # 不设此项时 Nginx 默认仅 1MB，既会误伤正常上传，也无法防御超大 body。
    client_max_body_size 25m;
    client_body_timeout 30s;

    # 统一安全响应头。
    # 注意：Nginx 的 add_header 不会被子级 location 继承——只要某个 location
    # 自己写了 add_header，本层的就会被丢弃。因此下面凡是自带 add_header 的
    # location，都重复了一遍这组头，改动时请保持同步。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 上传文件静态服务（房源照片等），长缓存
    location /uploads/ {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # API 反向代理（不缓存，动态请求）
    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 健康检查
    location = /health {
        proxy_pass http://fastapi:8000;
        access_log off;
    }

    # 静态资源（带 hash 的构建产物，长缓存）
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        gzip_static on;
    }

    # 其余静态文件
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA 路由回退
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

# ══════════════════════════════════════════════════════════════════════
# HTTPS 模板：公网部署时启用（当前注释掉，因为需要先有证书，
# 直接开启会让 Nginx 因找不到证书而启动失败）。
#
# 启用步骤：
#   1. 申请证书（Let's Encrypt: certbot certonly --webroot -w /usr/share/nginx/html -d your.domain）
#   2. 把证书目录挂载进 frontend 容器（docker-compose 的 frontend.volumes）
#   3. 取消下方注释，并把上面 80 端口的 server 改为只做 301 跳转
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name your.domain;
#     server_tokens off;
#
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         HIGH:!aNULL:!MD5;
#     ssl_prefer_server_ciphers on;
#     ssl_session_cache   shared:SSL:10m;
#     ssl_session_timeout 1d;
#
#     # 仅在 HTTPS 下有意义（浏览器会忽略明文 HTTP 传来的 HSTS）
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#     add_header X-Content-Type-Options "nosniff" always;
#     add_header X-Frame-Options "SAMEORIGIN" always;
#     add_header Referrer-Policy "strict-origin-when-cross-origin" always;
#
#     client_max_body_size 25m;
#     # ... 各 location 与上面 80 端口的 server 保持一致 ...
# }
#
# server {
#     listen 80;
#     server_name your.domain;
#     # 强制跳转 HTTPS
#     return 301 https://$host$request_uri;
# }
