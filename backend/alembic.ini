# Alembic configuration file

[alembic]
# Script location
script_location = alembic

# Path separator used by templates
path_separator = os

# Database URL (left empty, read from env.py, supports environment variable override)
sqlalchemy.url =

# Template configuration
# file_template = %%(rev)s_%%(slug)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone
timezone = Asia/Shanghai

# Append version id to slug
rev_id =

# Recursive version path
# version_path = 

# Output encoding
output_encoding = utf-8

# Default empty migration message
empty_msg = Empty migration

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
