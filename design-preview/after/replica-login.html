<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=375, initial-scale=1" />
<title>小程序登录页 · 复刻示意</title>
<style>
  /* 375×812；1rpx = 0.5px。数值取自 miniapp/src/pages/login/index.scss 与 app.scss */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #e9e6e1; }
  .frame {
    position: relative; width: 375px; height: 812px; overflow: hidden; background: #fbf9f6;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    color: #1c2733; line-height: 1.5; font-size: 14px;
  }
  .replica-tag {
    position: absolute; top: 52px; right: 8px; z-index: 99;
    background: rgba(17,24,39,.62); color: #fff; font-size: 10px; letter-spacing: .02em;
    padding: 3px 8px; border-radius: 999px;
  }
  .status-bar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; font-size: 13px; font-weight: 600; }
  .status-bar .dots { display: flex; gap: 4px; align-items: center; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: #1c2733; opacity: .7; }
  .battery { width: 20px; height: 9px; border: 1px solid #1c2733; border-radius: 2px; position: relative; }
  .battery::after { content: ""; position: absolute; inset: 1px 5px 1px 1px; background: #1c2733; border-radius: 1px; }

  .login-page { position: absolute; top: 44px; left: 0; right: 0; bottom: 0; padding: 0 12px 30px; }
  .login-header { padding-top: 48px; padding-bottom: 28px; text-align: center; }
  .login-title { display: block; font-size: 24px; font-weight: 700; color: #1c2733; margin-bottom: 6px; letter-spacing: -.02em; line-height: 1.2; }
  .login-subtitle { display: block; font-size: 14px; color: #55606c; font-weight: 400; letter-spacing: .02em; }

  .wx-login-btn {
    width: 100%; height: 48px; display: flex; align-items: center; justify-content: center;
    background: #14b8a6; color: #0b2f2b; font-size: 16px; font-weight: 700; border-radius: 18px;
    border: none; box-shadow: 0 4px 12px -2px rgba(20,184,166,.35); letter-spacing: .02em;
  }
  .wx-icon {
    background: #07c160; color: #fff; font-size: 11px; font-weight: 600;
    width: 26px; height: 26px; line-height: 26px; text-align: center; border-radius: 6px;
    margin-right: 8px; display: inline-block;
  }

  .divider { display: flex; align-items: center; margin: 22px 0 16px; }
  .divider-line { flex: 1; height: 1px; background: #ece7df; }
  .divider-text { margin: 0 12px; font-size: 12px; color: #5f6b78; }

  .fallback { background: #fff; border-radius: 18px; padding: 16px 18px 20px; border: 1px solid #ece7df; box-shadow: 0 1px 4px rgba(28,39,51,.04); }
  .fallback-tabs { display: flex; margin-bottom: 14px; border-bottom: 1px solid #ece7df; }
  .fallback-tab { flex: 1; text-align: center; font-size: 14px; color: #5f6b78; padding: 0 0 10px; position: relative; font-weight: 600; }
  .fallback-tab.active { color: #0f766e; }
  .fallback-tab.active::after {
    content: ""; position: absolute; left: 20%; right: 20%; bottom: -1px; height: 2px; background: #0f766e; border-radius: 2px;
  }

  .form-item { margin-bottom: 14px; }
  .form-label { display: block; font-size: 13px; color: #1c2733; margin-bottom: 6px; font-weight: 600; letter-spacing: .01em; }
  .form-input {
    width: 100%; height: 44px; border: 1px solid #ece7df; border-radius: 18px; padding: 0 12px;
    font-size: 14px; background: #fff; color: #98a1ab; display: flex; align-items: center;
  }
  .otp-row { display: flex; align-items: center; }
  .otp-input { flex: 1; margin-right: 8px; }
  .otp-btn {
    width: 100px; height: 44px; line-height: 44px; background: #f4f1ec; color: #0f766e;
    font-size: 13px; font-weight: 600; border-radius: 18px; border: 1px solid #ece7df; text-align: center;
  }
  .login-btn {
    width: 100%; height: 46px; line-height: 46px; background: #14b8a6; color: #0b2f2b;
    font-size: 16px; font-weight: 700; border-radius: 18px; margin-top: 4px; border: none; text-align: center;
  }
  .login-tip { margin-top: 18px; text-align: center; }
  .tip-text { font-size: 12px; color: #5f6b78; line-height: 1.6; }
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="replica-tag">复刻示意 · 非真实截图</div>
  <div class="status-bar">
    <span>9:41</span>
    <span class="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="battery"></span></span>
  </div>

  <div class="login-page">
    <div class="login-header">
      <span class="login-title">VIP Rental</span>
      <span class="login-subtitle">房地产租赁管理系统 · 欢迎登录</span>
    </div>

    <div class="wx-login-btn"><span class="wx-icon">微信</span>微信一键授权登录</div>

    <div class="divider"><span class="divider-line"></span><span class="divider-text">其他方式登录</span><span class="divider-line"></span></div>

    <div class="fallback">
      <div class="fallback-tabs">
        <div class="fallback-tab active">手机号登录</div>
        <div class="fallback-tab">手机号注册</div>
      </div>

      <div class="form-item">
        <span class="form-label">手机号</span>
        <div class="form-input">请输入手机号</div>
      </div>

      <div class="form-item">
        <span class="form-label">验证码</span>
        <div class="otp-row">
          <div class="form-input otp-input">请输入验证码</div>
          <div class="otp-btn">获取验证码</div>
        </div>
      </div>

      <div class="login-btn">登录</div>
    </div>

    <div class="login-tip">
      <div class="tip-text">提示：微信登录默认以租客身份进入；业主/经纪/员工账号可切换手机号注册选择身份。</div>
    </div>
  </div>
</div>
</body>
</html>
